<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elite Autohaus – Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Open Sans', sans-serif;
      background: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box {
      width: 400px;
      background: #111;
      border: 1px solid #222;
      border-top: 2px solid rgba(255,255,255,0.2);
      padding: 3rem 2.5rem;
    }
    .logo-wrap { text-align: center; margin-bottom: 2rem; }
    .logo-wrap img { height: 56px; width: auto; }
    .sub {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #555;
      text-align: center;
      margin-bottom: 2.5rem;
    }
    label {
      display: block;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 0.4rem;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #000;
      border: 1px solid #222;
      border-bottom: 2px solid #333;
      color: #fff;
      font-family: 'Open Sans', sans-serif;
      font-size: 0.9rem;
      margin-bottom: 1.2rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-bottom-color: #ffffff; }
    .btn {
      width: 100%;
      padding: 0.85rem;
      background: #ffffff;
      color: #000000;
      border: none;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #cccccc; }
    .error {
      color: #ff9999;
      font-size: 0.78rem;
      margin-top: 1rem;
      display: none;
      text-align: center;
    }
    .back {
      display: block;
      margin-top: 1.5rem;
      color: #444;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      text-align: center;
      transition: color 0.2s;
    }
    .back:hover { color: #ffffff; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo-wrap">
      <img src="../images/logo.png" alt="Elite Autohaus" />
    </div>
    <div class="sub">Admin Portal</div>

    <label>Username</label>
    <input type="text" id="username" placeholder="admin" />

    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()" />

    <button class="btn" onclick="login()">Log In</button>
    <p class="error" id="err">&#10007; &nbsp;Wrong username or password. Try again.</p>
    <a href="../index.html" class="back">&#8592; Back to website</a>
  </div>

  <script>
    /* ── CHANGE YOUR CREDENTIALS HERE ── */
    const ADMIN_USER = 'Konrad';
    const ADMIN_PASS = 'Polska89';

    function login() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      if (u === ADMIN_USER && p === ADMIN_PASS) {
        sessionStorage.setItem('ea_admin', 'true');
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('err').style.display = 'block';
      }
    }
  </script>
</body>
</html>
